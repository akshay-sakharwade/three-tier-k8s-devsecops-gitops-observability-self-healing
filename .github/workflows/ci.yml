name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: docker build -t akshayd8/three-tier-frontend:${{ github.sha }} ./frontend

      - name: Build backend image
        run: docker build -t akshayd8/three-tier-backend:${{ github.sha }} ./backend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: akshayd8/three-tier-frontend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          cache: false

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: akshayd8/three-tier-backend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          cache: false

      - name: Push frontend
        run: docker push akshayd8/three-tier-frontend:${{ github.sha }}

      - name: Push backend
        run: docker push akshayd8/three-tier-backend:${{ github.sha }}
